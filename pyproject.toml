[project]
name = "seg-opt"
version = "0.1.0"
description = "Daj kamienia"
readme = "README.md"

requires-python = ">=3.13,<3.14"
dependencies = [
    "lightning>=2.6,<3",
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers>=4.56,<5",
    "wandb>=0.19,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
