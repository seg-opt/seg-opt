[project]
name = "seg-opt"
version = "0.1.0"
description = "Daj kamienia"
readme = "README.md"

requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "torch>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
