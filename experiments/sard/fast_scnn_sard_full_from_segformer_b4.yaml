model:
  name: fast_scnn
  pretrained: false
  freeze_backbone: false

data:
  dataset_root: ../../datasets/artificial_lunar_landscape
  split_manifest: experiments/baselines_benchmark/split_seed42_aligned.json
  class_names: [background, sky, small_rock, large_rock]
  image_height: 512
  image_width: 768
  num_workers: 8
  mask_variant: clean
  augmentation: {flip_probability: 0.5, brightness: 0.15, contrast: 0.15, gamma_min: 0.85, gamma_max: 1.15}

loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}
metrics: {trimap_kernel_size: 7}

training:
  output_dir: results/sard/fast_scnn_from_segformer_b4/full/seed42
  epochs: 20
  batch_size: 8
  accumulate_grad_batches: 2
  learning_rate: 5.0e-4
  backbone_learning_rate: null
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 42

distillation:
  method: sard
  teacher:
    config_path: experiments/baselines_benchmark/segformer_b4.yaml
    checkpoint_path: results/baselines_benchmark/segformer_b4/seed42/checkpoints/best.ckpt
  spatial_stride: 8
  sard_feature_weight: 1.0
  sard_distribution_weight: 0.5
  sard_edge_weight: 2.0
  sard_corner_weight: 1.0
  sard_density_weight: 1.0
  sard_density_radius: 7
  sard_noise_alpha: 0.5
  sard_projection_channels: 256
  sard_denoiser_hidden_channels: 128
