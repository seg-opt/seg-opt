model:
  name: fast_scnn
  pretrained: false
  freeze_backbone: false

data:
  dataset: ade20k
  dataset_root: ../../datasets/ade20k
  split_manifest: experiments/sard/ade20k/split_seed42.json
  class_names: [wall, building, sky, floor, tree, ceiling, road, bed, windowpane, grass, cabinet, sidewalk, person, earth, door, table, mountain, plant, curtain, chair, car, water, painting, sofa, shelf, house, sea, mirror, rug, field, armchair, seat, fence, desk, rock, wardrobe, lamp, bathtub, railing, cushion, base, box, column, signboard, chest_of_drawers, counter, sand, sink, skyscraper, fireplace, refrigerator, grandstand, path, stairs, runway, case, pool_table, pillow, screen_door, stairway, river, bridge, bookcase, blind, coffee_table, toilet, flower, book, hill, bench, countertop, stove, palm, kitchen_island, computer, swivel_chair, boat, bar, arcade_machine, hovel, bus, towel, light, truck, tower, chandelier, awning, streetlight, booth, television_receiver, airplane, dirt_track, apparel, pole, land, bannister, escalator, ottoman, bottle, buffet, poster, stage, van, ship, fountain, conveyer_belt, canopy, washer, plaything, swimming_pool, stool, barrel, basket, waterfall, tent, bag, minibike, cradle, oven, ball, food, step, tank, trade_name, microwave, pot, animal, bicycle, lake, dishwasher, screen, blanket, sculpture, hood, sconce, vase, traffic_light, tray, ashcan, fan, pier, crt_screen, plate, monitor, bulletin_board, shower, radiator, glass, clock, flag]
  image_height: 512
  image_width: 512
  num_workers: 8
  augmentation: {flip_probability: 0.5, brightness: 0.15, contrast: 0.15, gamma_min: 0.85, gamma_max: 1.15}

loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}

training:
  output_dir: results/sard/ade20k/fast_scnn_sard_full/seed44
  epochs: 20
  batch_size: 8
  accumulate_grad_batches: 2
  learning_rate: 5.0e-4
  backbone_learning_rate: null
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 44

distillation:
  method: sard
  teacher:
    config_path: experiments/sard/ade20k/segformer_b4.yaml
    checkpoint_path: results/sard/ade20k/segformer_b4/seed42/checkpoints/best.ckpt
  spatial_stride: 8
  sard_feature_weight: 1.0
  sard_distribution_weight: 0.5
  sard_edge_weight: 2.0
  sard_corner_weight: 1.0
  sard_density_weight: 1.0
  sard_density_radius: 7
  sard_noise_alpha: 0.5
  sard_projection_channels: 256
  sard_denoiser_hidden_channels: 128
