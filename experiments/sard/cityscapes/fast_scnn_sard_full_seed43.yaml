model:
  name: fast_scnn
  pretrained: false
  freeze_backbone: false

data:
  dataset: cityscapes
  dataset_root: ../../datasets/cityscapes
  split_manifest: experiments/sard/cityscapes/split_seed42.json
  class_names: [road, sidewalk, building, wall, fence, pole, traffic_light, traffic_sign, vegetation, terrain, sky, person, rider, car, truck, bus, train, motorcycle, bicycle]
  image_height: 512
  image_width: 1024
  num_workers: 8
  augmentation: {flip_probability: 0.5, brightness: 0.15, contrast: 0.15, gamma_min: 0.85, gamma_max: 1.15}

loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}

training:
  output_dir: results/sard/cityscapes/fast_scnn_sard_full/seed43
  epochs: 50
  batch_size: 8
  accumulate_grad_batches: 2
  learning_rate: 5.0e-4
  backbone_learning_rate: null
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 43

distillation:
  method: sard
  teacher:
    config_path: experiments/sard/cityscapes/segformer_b4.yaml
    checkpoint_path: results/sard/cityscapes/segformer_b4/seed42/checkpoints/best.ckpt
  spatial_stride: 8
  sard_feature_weight: 1.0
  sard_distribution_weight: 0.5
  sard_edge_weight: 2.0
  sard_corner_weight: 1.0
  sard_density_weight: 1.0
  sard_density_radius: 7
  sard_noise_alpha: 0.5
  sard_projection_channels: 256
  sard_denoiser_hidden_channels: 128
