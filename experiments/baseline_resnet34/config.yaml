model:
  num_classes: 4
  # Required by the common schema, but not loaded when distillation.weight=0.
  teacher:
    name: mask2former
    model_id: facebook/mask2former-swin-large-ade-semantic
    freeze: true
  student:
    backbone: resnet
    backbone_id: resnet34
    decoder: unet
    pretrained: true

distillation:
  temperature: 4.0
  weight: 0.0
  hard_label_weight: 1.0

data:
  dataset_root: ../../datasets/artificial_lunar_landscape
  image_dir: ../../datasets/artificial_lunar_landscape/images/render
  mask_dir: ../../datasets/artificial_lunar_landscape/images/ground
  excluded_id_files:
    - cam_anomaly_IDs.txt
    - ground_facing_IDs.txt
    - mismatch_IDs.txt
    - shadow_IDs.txt
  class_names: [background, sky, small_rock, large_rock]
  image_size: 512
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1

training:
  epochs: 10
  batch_size: 16
  num_workers: 8
  learning_rate: 5.0e-4
  weight_decay: 0.05
  precision: bf16
  logging_steps: 20
  eval_steps: 200
  save_steps: 200
  seed: 42
  output_dir: results/baseline_resnet34
