model:
  num_classes: 4
  teacher:
    name: dinov3
    model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    freeze: true
    # Keep the official-style normalized linear probe first. Change only this
    # field to "lightweight" for the small convolutional-head ablation.
    head_type: linear
    head_batch_norm: true
    head_hidden_channels: 256
    head_dropout: 0.1
    # Set to 2 after the frozen-probe baseline is established.
    unfreeze_last_blocks: 0

data:
  dataset_root: ../../datasets/artificial_lunar_landscape
  image_dir: ../../datasets/artificial_lunar_landscape/images/render
  mask_dir: ../../datasets/artificial_lunar_landscape/images/ground
  excluded_id_files:
    - cam_anomaly_IDs.txt
    - ground_facing_IDs.txt
    - mismatch_IDs.txt
    - shadow_IDs.txt
    - top200_largerocks_IDs.txt
  class_names: [background, sky, small_rock, large_rock]
  # Training uses fixed class-aware crops; evaluation preserves the 3:2 frame
  # and pads it to a multiple of DINO's patch size.
  image_size: 512
  eval_short_side: 512
  size_divisor: 16
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  # A meaningful but bounded first experiment. Remove these limits later.
  max_train_samples: 512
  max_val_samples: 128
  max_test_samples: 128
  augmentation:
    scale_min: 0.5
    scale_max: 2.0
    flip_probability: 0.5
    class_aware_probability: 0.75
    class_aware_attempts: 8
    rare_class_ids: [2, 3]
    rare_class_weights: [1.0, 4.0]
    brightness: 0.15
    contrast: 0.15
    gamma_min: 0.85
    gamma_max: 1.15

loss:
  cross_entropy_weight: 1.0
  dice_weight: 0.5
  class_weights: [0.25, 0.5, 1.0, 2.0]
  ignore_index: 255

evaluation:
  crop_size: 512
  stride: 341

training:
  epochs: 20
  batch_size: 4
  num_workers: 8
  learning_rate: 1.0e-3
  # Used only when unfreeze_last_blocks is non-zero.
  backbone_learning_rate: 1.0e-5
  weight_decay: 1.0e-3
  precision: bf16
  logging_steps: 10
  seed: 42
  output_dir: results/dinov3_probe_v2
