defaults:
  - _self_
  - dataset: ???
  - method: ???
  - teacher: ???
  - student: ???

model:
  pretrained: true
  freeze_backbone: false

loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}
metrics: {trimap_kernel_size: 7}

training:
  output_dir: results/hydra
  epochs: 80
  batch_size: 8
  accumulate_grad_batches: 2
  learning_rate: 6.0e-4
  backbone_learning_rate: 6.0e-5
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 42
