model:
  num_classes: 4
  student:
    backbone: fast_scnn
    backbone_id: fast_scnn
    decoder: fast_scnn
    pretrained: false

distillation:
  temperature: 4.0
  weight: 0.0
  hard_label_weight: 1.0

data:
  dataset_root: ../../datasets/artificial_lunar_landscape
  image_dir: ../../datasets/artificial_lunar_landscape/images/render
  mask_dir: ../../datasets/artificial_lunar_landscape/images/ground
  excluded_id_files:
    - cam_anomaly_IDs.txt
    - ground_facing_IDs.txt
    - mismatch_IDs.txt
    - shadow_IDs.txt
  class_names: [background, sky, small_rock, large_rock]
  image_size: 512
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1

# The shared supervised-baseline entrypoint currently trains plain CE. Keep
# these values explicit so the recorded configuration matches the actual loss.
loss:
  cross_entropy_weight: 1.0
  dice_weight: 0.0
  class_weights: null
  ignore_index: 255

evaluation:
  crop_size: null
  stride: null

training:
  epochs: 10
  batch_size: 16
  num_workers: 8
  learning_rate: 5.0e-4
  weight_decay: 0.05
  precision: bf16
  logging_steps: 20
  seed: 42
  output_dir: results/baseline_fast_scnn/equal_recipe_v1_retry1
