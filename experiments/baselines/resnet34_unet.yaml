model:
  name: resnet34_unet
  model_id: resnet34
  pretrained: true
  freeze_backbone: false

data:
  dataset_root: ../../datasets/artificial_lunar_landscape
  split_manifest: experiments/baselines/split_seed42.json
  class_names: [background, sky, small_rock, large_rock]
  image_height: 512
  image_width: 768
  num_workers: 8
  augmentation: {flip_probability: 0.5, brightness: 0.15, contrast: 0.15, gamma_min: 0.85, gamma_max: 1.15}

loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}

training:
  output_dir: results/baselines/resnet34_unet/seed42
  epochs: 20
  batch_size: 8
  accumulate_grad_batches: 2
  learning_rate: 3.0e-4
  backbone_learning_rate: 3.0e-5
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 42
