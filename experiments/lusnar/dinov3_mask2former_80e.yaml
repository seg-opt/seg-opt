model:
  name: dinov3_vitl16_mask2former
  model_id: facebook/dinov3-vitl16-pretrain-lvd1689m
  decoder_model_id: facebook/mask2former-swin-large-ade-semantic
  pretrained: true
  freeze_backbone: true

data:
  dataset: lusnar
  dataset_root: ../../datasets/lusnar
  split_manifest: experiments/lusnar/split_scenes.json
  class_names: [regolith, crater, rock, mountain, sky]
  image_height: 512
  image_width: 512
  num_workers: 8
  mask_variant: ground
  augmentation: {flip_probability: 0.5, brightness: 0.15, contrast: 0.15, gamma_min: 0.85, gamma_max: 1.15}

loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}
metrics: {trimap_kernel_size: 7}

training:
  output_dir: results/lusnar/dinov3_mask2former_80e/seed42
  epochs: 80
  batch_size: 1
  accumulate_grad_batches: 16
  learning_rate: 1.0e-4
  backbone_learning_rate: null
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 42
