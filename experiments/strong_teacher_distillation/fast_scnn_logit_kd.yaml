model: {name: fast_scnn, pretrained: false, freeze_backbone: false}
data:
  dataset_root: ../../datasets/artificial_lunar_landscape
  split_manifest: experiments/baselines_benchmark/split_seed42_aligned.json
  class_names: [background, sky, small_rock, large_rock]
  image_height: 512
  image_width: 768
  num_workers: 8
  mask_variant: clean
  augmentation: {flip_probability: 0.5, brightness: 0.15, contrast: 0.15, gamma_min: 0.85, gamma_max: 1.15}
loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}
metrics: {trimap_kernel_size: 7}
training:
  output_dir: results/strong_teacher_distillation/fast_scnn_logit_kd/seed42
  epochs: 80
  batch_size: 8
  accumulate_grad_batches: 2
  learning_rate: 5.0e-4
  backbone_learning_rate: null
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 42
distillation:
  method: vanilla
  teacher:
    config_path: experiments/strong_teacher_distillation/teacher_dinov3_mask2former.yaml
    checkpoint_path: results/dinov3_mask2former/lunar_teacher_80e/seed42/checkpoints/best.ckpt
  spatial_stride: 8
  vanilla_weight: 1.0
  vanilla_temperature: 1.0
