model:
  name: dinov3_vitl16
  model_id: facebook/dinov3-vitl16-pretrain-lvd1689m
  pretrained: true
  freeze_backbone: true

data:
  dataset_root: ../../datasets/artificial_lunar_landscape
  split_manifest: experiments/baselines_benchmark/split_seed42_aligned.json
  class_names: [background, sky, small_rock, large_rock]
  image_height: 512
  image_width: 768
  num_workers: 8
  mask_variant: clean
  augmentation: {flip_probability: 0.5, brightness: 0.15, contrast: 0.15, gamma_min: 0.85, gamma_max: 1.15}

loss: {cross_entropy_weight: 1.0, dice_weight: 0.5, ignore_index: 255}
metrics: {trimap_kernel_size: 7}

training:
  output_dir: results/baselines_benchmark/dinov3_vitl16/seed42
  epochs: 20
  batch_size: 2
  accumulate_grad_batches: 8
  learning_rate: 1.0e-3
  backbone_learning_rate: null
  weight_decay: 0.05
  warmup_fraction: 0.05
  precision: bf16
  logging_steps: 20
  seed: 42
