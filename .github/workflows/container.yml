name: Container

on:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "containers/Dockerfile"
      - "containers/requirements.lock"
      - "containers/smoke_test.py"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "containers/Dockerfile"
      - "containers/requirements.lock"
      - "containers/smoke_test.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space for SIF conversion
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache
          df -h /

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          load: true
          push: false
          tags: seg-opt:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            OCI_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run OCI smoke test
        run: docker run --rm seg-opt:ci

      - name: Remove OCI build cache
        run: |
          docker builder prune --all --force
          df -h /

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2

      - name: Build and verify SIF
        id: sif
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="seg-opt-sha-${GITHUB_SHA::7}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            artifact_name="seg-opt-${GITHUB_REF_NAME}"
          fi
          mkdir -p dist
          apptainer build "dist/${artifact_name}.sif" docker-daemon://seg-opt:ci
          apptainer inspect "dist/${artifact_name}.sif"
          apptainer exec "dist/${artifact_name}.sif" python3 /opt/seg-opt/smoke_test.py
          (cd dist && sha256sum "${artifact_name}.sif" > "${artifact_name}.sif.sha256")
          sha256sum --check "dist/${artifact_name}.sif.sha256"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI tags
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n $tag ]] || continue
            docker tag seg-opt:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Upload SIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sif.outputs.artifact_name }}
          path: |
            dist/${{ steps.sif.outputs.artifact_name }}.sif
            dist/${{ steps.sif.outputs.artifact_name }}.sif.sha256
          compression-level: 0
          retention-days: 14

      - name: Attach SIF to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.sif.outputs.artifact_name }}.sif
            dist/${{ steps.sif.outputs.artifact_name }}.sif.sha256
          fail_on_unmatched_files: true