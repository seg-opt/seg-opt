name: Development container

on:
  pull_request:
    paths:
      - ".github/workflows/development-container.yml"
      - ".dockerignore"
      - ".python-version"
      - "containers/development.Dockerfile"
      - "containers/development_smoke_test.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    tags: ["dev-v*"]
    paths:
      - ".github/workflows/development-container.yml"
      - ".dockerignore"
      - ".python-version"
      - "containers/development.Dockerfile"
      - "containers/development_smoke_test.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}-development

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space for SIF conversion
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache
          df -h /

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,prefix=dep-sha-
            type=ref,event=tag
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/development.Dockerfile
          load: true
          push: false
          tags: seg-opt-development:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            OCI_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run OCI smoke test
        run: docker run --rm seg-opt-development:ci

      - name: Remove OCI build cache
        run: |
          docker builder prune --all --force
          df -h /

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2

      - name: Build and verify SIF
        id: sif
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="seg-opt-development-dep-sha-${GITHUB_SHA::7}"
          if [[ $GITHUB_REF == refs/tags/dev-v* ]]; then
            artifact_name="seg-opt-development-${GITHUB_REF_NAME}"
          fi
          mkdir -p dist
          apptainer build "dist/${artifact_name}.sif" docker-daemon://seg-opt-development:ci
          apptainer inspect "dist/${artifact_name}.sif"
          apptainer exec "dist/${artifact_name}.sif" \
            python /opt/seg-opt-env/development_smoke_test.py
          (cd dist && sha256sum "${artifact_name}.sif" > "${artifact_name}.sif.sha256")
          (cd dist && sha256sum --check "${artifact_name}.sif.sha256")
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload SIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sif.outputs.artifact_name }}
          path: |
            dist/${{ steps.sif.outputs.artifact_name }}.sif
            dist/${{ steps.sif.outputs.artifact_name }}.sif.sha256
          compression-level: 0
          retention-days: 7

      - name: Attach SIF to GitHub release
        if: startsWith(github.ref, 'refs/tags/dev-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.sif.outputs.artifact_name }}.sif
            dist/${{ steps.sif.outputs.artifact_name }}.sif.sha256
          fail_on_unmatched_files: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI tags
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n $tag ]] || continue
            docker tag seg-opt-development:ci "$tag"
            for attempt in 1 2 3; do
              if docker push "$tag"; then
                break
              fi
              if ((attempt == 3)); then
                echo "error: failed to publish $tag after $attempt attempts" >&2
                exit 1
              fi
              echo "warning: retrying $tag after failed attempt $attempt" >&2
            done
          done <<< "$IMAGE_TAGS"